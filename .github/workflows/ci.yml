name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar-site:
    name: Verificar site estático
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checar sintaxe dos arquivos JS
        run: |
          status=0
          while IFS= read -r -d '' f; do
            echo "node --check $f"
            node --check "$f" || status=1
          done < <(find site -name '*.js' -print0)
          exit $status

      - name: Checar referências locais quebradas em HTML
        run: node .github/scripts/checar-referencias.js

      - name: Validar esquema dos mergulhos
        run: node .github/scripts/checar-mergulhos.js

      - name: Garantir que nenhuma chave de API foi commitada
        run: |
          if grep -rEn 'sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}' site/; then
            echo "Possível chave de API encontrada em site/ — não commitar credenciais."
            exit 1
          fi
          echo "Nenhuma chave de API encontrada."
